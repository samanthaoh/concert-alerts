name: Check for new concert announcements

on:
  schedule:
    - cron: '0 16 * * *' # 9am Pacific (UTC-7 during PDT) — adjust if needed
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab to test

permissions:
  contents: write # needed so the workflow can commit seen_events.json updates

jobs:
  check-events:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run event check
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
        run: node scripts/check-events.js

      - name: Commit any new events
        run: |
          git config user.name "concert-alerts-bot"
          git config user.email "actions@github.com"
          git add data/seen_events.json
          git diff --staged --quiet || git commit -m "Add newly found events"
          git push
